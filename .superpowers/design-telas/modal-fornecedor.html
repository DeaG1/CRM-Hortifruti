        <sc-if value="{{ modalFornecedor }}" hint-placeholder-val="">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
          <div style="grid-column:1/-1;">
            <label style="font-size:11.5px; font-weight:600; color:#6a685c; margin-bottom:5px; display:block;">Nome do produtor / fazenda</label>
            <input data-field="nome" value="{{ draft.nome }}" onInput="{{ updateDraft }}" placeholder="Ex.: Fazenda Boa Terra" style="width:100%; padding:9px 11px; border:1px solid #d8d3c2; border-radius:8px; font-size:13px; font-family:'Public Sans',sans-serif; color:#2a2a24; background:#fff; box-sizing:border-box;">
          </div>
          <div>
            <label style="font-size:11.5px; font-weight:600; color:#6a685c; margin-bottom:5px; display:block;">Região</label>
            <input data-field="regiao" value="{{ draft.regiao }}" onInput="{{ updateDraft }}" placeholder="Ex.: Londrina, Norte do PR" style="width:100%; padding:9px 11px; border:1px solid #d8d3c2; border-radius:8px; font-size:13px; font-family:'Public Sans',sans-serif; color:#2a2a24; background:#fff; box-sizing:border-box;">
          </div>
          <div>
            <label style="font-size:11.5px; font-weight:600; color:#6a685c; margin-bottom:5px; display:block;">Telefone / contato</label>
            <input data-field="contato" value="{{ draft.contato }}" onInput="{{ updateDraft }}" style="width:100%; padding:9px 11px; border:1px solid #d8d3c2; border-radius:8px; font-size:13px; font-family:'Public Sans',sans-serif; color:#2a2a24; background:#fff; box-sizing:border-box;">
          </div>
          <div style="grid-column:1/-1;">
            <label style="font-size:11.5px; font-weight:600; color:#6a685c; margin-bottom:6px; display:block;">Produtos fornecidos <span style="color:#9a9784; font-weight:400;">— {{ qtdProdVinculados }} selecionado(s)</span></label>
            <div style="display:flex; flex-wrap:wrap; gap:7px;">
              <sc-for list="{{ produtoCheckList }}" as="pc" hint-placeholder-count="6">
                <button onClick="{{ pc.toggle }}" style="display:inline-flex; align-items:center; gap:6px; background:{{ pc.bg }}; border:1px solid {{ pc.borda }}; border-radius:20px; padding:7px 13px; font-size:12.5px; font-weight:{{ pc.peso }}; color:{{ pc.fg }}; cursor:pointer; font-family:'Public Sans',sans-serif;" style-hover="border-color:#7cb342;">
                  <span style="font-size:11px; color:#5a7d3a; width:9px;">{{ pc.marca }}</span>{{ pc.nome }}
                  <span style="font-size:10.5px; color:#9a9784;">{{ pc.un }}</span>
                </button>
              </sc-for>
            </div>
            <sc-if value="{{ semProdutoParaVincular }}" hint-placeholder-val="">
              <div style="background:#f6e4dc; border:1px solid #e7cbbf; border-radius:9px; padding:11px 13px; font-size:12.5px; color:#9a4a2e;">Nenhum produto cadastrado ainda. Cadastre os produtos primeiro para poder vinculá-los a este fornecedor.</div>
            </sc-if>
          </div>
          <div style="grid-column:1/-1; background:#eef3e6; border:1px solid #d7e3c6; border-radius:9px; padding:10px 13px; font-size:12px; color:#4a6b2e;"><strong>Preço de compra</strong>, <strong>variação</strong>, <strong>última coleta</strong> e <strong>aproveitamento</strong> são calculados automaticamente a partir das Entradas (compras) deste fornecedor.</div>
        </div>
        </sc-if>

        <!-- ---- PRODUTO FORM ---- -->
