name = "crm-hortifruti"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# O front e a API sao servidos pelo MESMO Worker, de proposito.
#
# O cookie de sessao e HttpOnly + SameSite=Lax. `Lax` nao viaja em requisicao
# cross-site feita por JavaScript — entao front em *.pages.dev chamando a API
# em *.workers.dev simplesmente nao autentica. As saidas seriam trocar para
# SameSite=None (perdendo a protecao contra CSRF) ou depender de um dominio
# proprio que ainda nao existe. Servir tudo da mesma origem resolve os dois
# sem abrir mao de nada.
#
# `run_worker_first` garante que /api/* chegue ao Worker. Sem isso, o
# not_found_handling de SPA devolveria index.html para as rotas da API.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Hyperdrive: o Worker nao abre conexao TCP direta ao Supabase.
# No plano gratuito, cada invocacao tem teto de 50 subrequests, e o
# handshake TCP+TLS do postgres.js contra o Supabase estoura esse teto —
# a requisicao morre com "Too many subrequests" apos ~18s. O Hyperdrive
# mantem o pool do lado da Cloudflare e elimina esse custo.
# Cache desativado de proposito: num CRM transacional, resposta cacheada
# faria o usuario salvar um cliente e nao ve-lo na lista.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "f02ff5abe18c44ee93a3d6279c2c788f"

# Smart Placement: roda o Worker perto do BANCO, nao do usuario.
# Medido antes disto: o Worker respondia de Newark (CF-RAY ...-EWR) e cada
# ida e volta ate o Supabase em Sao Paulo custava ~116ms; uma transacao
# (BEGIN + set_config + query + COMMIT) somava ~594ms, e o login ~2,4s.
# Como quase todo o tempo e conversa com o banco, vale mais estar perto dele.
# Os assets estaticos nao invocam o Worker (run_worker_first e seletivo para
# /api/*), entao continuam servidos do edge proximo do usuario.
[placement]
mode = "smart"
