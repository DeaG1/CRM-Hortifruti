        <sc-if value="{{ modalPerda }}" hint-placeholder-val="">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
          <div>
            <label style="font-size:11.5px; font-weight:600; color:#6a685c; margin-bottom:5px; display:block;">Data da perda</label>
            <input type="date" data-field="data" value="{{ draft.data }}" onInput="{{ updateDraft }}" style="width:100%; padding:9px 11px; border:1px solid #d8d3c2; border-radius:8px; font-size:13px; font-family:'Public Sans',sans-serif; color:#2a2a24; background:#fff; box-sizing:border-box;">
          </div>
          <div>
            <label style="font-size:11.5px; font-weight:600; color:#6a685c; margin-bottom:5px; display:block;">Produto</label>
            <select data-field="produtoId" value="{{ draft.produtoId }}" onChange="{{ updateDraft }}" style="width:100%; padding:9px 11px; border:1px solid #d8d3c2; border-radius:8px; font-size:13px; font-family:'Public Sans',sans-serif; color:#2a2a24; background:#fff; box-sizing:border-box;">
              <option value="">Selecione…</option>
              <sc-for list="{{ produtoOptions }}" as="po" hint-placeholder-count="3">
                <option value="{{ po.id }}">{{ po.nome }}</option>
              </sc-for>
            </select>
          </div>
          <div>
            <label style="font-size:11.5px; font-weight:600; color:#6a685c; margin-bottom:5px; display:block;">Unidade</label>
            <select data-field="un" value="{{ draft.un }}" onChange="{{ updateDraft }}" style="width:100%; padding:9px 11px; border:1px solid #d8d3c2; border-radius:8px; font-size:13px; font-family:'Public Sans',sans-serif; color:#2a2a24; background:#fff; box-sizing:border-box;">
              <sc-for list="{{ unidades }}" as="u" hint-placeholder-count="6">
                <option value="{{ u }}">{{ u }}</option>
              </sc-for>
            </select>
          </div>
          <div>
            <label style="font-size:11.5px; font-weight:600; color:#6a685c; margin-bottom:5px; display:block;">Quantidade perdida</label>
            <input type="number" step="0.01" data-field="qtd" value="{{ draft.qtd }}" onInput="{{ updateDraft }}" style="width:100%; padding:9px 11px; border:1px solid #d8d3c2; border-radius:8px; font-size:13px; font-family:'IBM Plex Mono',monospace; color:#2a2a24; background:#fff; box-sizing:border-box; text-align:right;">
          </div>
          <div style="grid-column:1/-1;">
            <label style="font-size:11.5px; font-weight:600; color:#6a685c; margin-bottom:5px; display:block;">Motivo</label>
            <select data-field="motivo" value="{{ draft.motivo }}" onChange="{{ updateDraft }}" style="width:100%; padding:9px 11px; border:1px solid #d8d3c2; border-radius:8px; font-size:13px; font-family:'Public Sans',sans-serif; color:#2a2a24; background:#fff; box-sizing:border-box;">
              <option value="armazenagem">Armazenagem</option>
              <option value="vencimento">Vencimento</option>
              <option value="manuseio">Manuseio</option>
              <option value="recusa do cliente">Recusa do cliente</option>
              <option value="sobra de rota">Sobra de rota</option>
            </select>
          </div>
          <div style="grid-column:1/-1;">
            <label style="font-size:11.5px; font-weight:600; color:#6a685c; margin-bottom:5px; display:block;">Observação</label>
            <input data-field="obs" value="{{ draft.obs }}" onInput="{{ updateDraft }}" placeholder="Ex.: caixa amassada no empilhamento" style="width:100%; padding:9px 11px; border:1px solid #d8d3c2; border-radius:8px; font-size:13px; font-family:'Public Sans',sans-serif; color:#2a2a24; background:#fff; box-sizing:border-box;">
          </div>
          <div style="grid-column:1/-1; background:#f6efe4; border:1px solid #ecdcc6; border-radius:9px; padding:10px 13px; font-size:12px; color:#8a5a2a;">Esta perda <strong>desconta do estoque</strong> e entra no <strong>índice de perdas</strong> junto com a perda registrada nas compras.</div>
        </div>
        </sc-if>
